}
function ptsOf(f){return REL[f.rel].p}

  pop(d.x,d.y-40,'+'+pts+' '+d.rel+(R0.p>=40?'!':''),R0.c);josh=Math.min(100,josh+R0.p/4+4);snd('pick');

let nz=0;
function wall(o,r){BAR.forEach(([bx,by,bw,bh])=>{const nx=Math.max(bx,Math.min(o.x,bx+bw)),ny=Math.max(by,Math.min(o.y,by+bh)),dx=o.x-nx,dy=o.y-ny,d=Math.hypot(dx,dy);if(d<r){if(d>0){o.x+=dx/d*(r-d);o.y+=dy/d*(r-d)}else o.x-=r}})}

      const ra=t/T0;stars=ra>=.4?3:ra>=.15?2:1;sc+=Math.ceil(t)*5;gain=stars*50;if(M&&((M.rel&&(cnt[M.rel]||0)>=M.n)||(M.k==='nz'&&nz)||(M.k==='nc'&&!chal))){mdone=1;gain+=100}

    const bands=F.filter(f=>f.rel==='Band').length,sp=Math.max(2.3,3.7-F.length*.025)*(1+Math.min(.2,bands*.04))*(S.own.shoes?1.1:1)*(P.bs?1.5:1)*(nch?1.25:1)*(rain?.88:1);let dx=0,dy=0;
    if(K.ArrowLeft||K.KeyA)dx--;if(K.ArrowRight||K.KeyD)dx++;if(K.ArrowUp||K.KeyW)dy--;if(K.ArrowDown||K.KeyS)dy++;
    if(tg.on){const[cx,cy]=cam(),wx=cx+tg.sx/Z,wy=cy+tg.sy/Z,d=Math.hypot(wx-P.x,wy-P.y);if(d>8){dx=(wx-P.x)/d;dy=(wy-P.y)/d}}
